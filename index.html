{const st=document.createElement('style');st.textContent='.ic{display:inline-block;width:1.25em;height:1.25em;background-size:contain;background-repeat:no-repeat;background-position:center;vertical-align:-.28em}'+Object.keys(ICN).map(k=>`.ic.${k}{background-image:url(${ICN[k]})}`).join('');document.head.appendChild(st)}

function bringInfo(m){const sp=SPECIES[m.sp],mu=C.RARITY[m.rar||0].mult,egg=m.stage==='egg',stg=egg?'baby':m.stage;
 let c,st;if(sp.inc){c=sp.inc.coin;st=sp.inc.stone}else{c=Math.round(C.COIN[stg]*mu);st=Math.round(C.STONE[stg]*mu)}
 const parts=[];if(c)parts.push(`${ic('coin')}×${c}`);if(st)parts.push(`${ic('stone')}×${st}`);
 let t=parts.length?'毎時間 '+parts.join(' '):'';
 if(sp.bring){const n=Math.max(1,Math.round(sp.bring.n*mu));t+=(t?'、':'')+`${sp.bring.every}時間ごとに ⏱×${n}`}
 if(!t)t='なし';
 if(egg)return `持ってくるアイテム（ふ化後）: ${t}`;
 if(m.dead)return `持ってくるアイテム: ${t}（死亡中は持ってきません）`;
 return `持ってくるアイテム: ${t}${m.hunger===0?'（満腹度0のあいだは持ってきません）':''}`}

function load(){try{S=JSON.parse(localStorage.getItem(C.KEY))}catch(e){}
 if(!S){S={coin:C.START_COIN,stone:0,size:C.START_SIZE,mons:[],last:now(),acc:0};S.mons.push(mk(0))}
 S.box=S.box||[];S.boxCap=S.boxCap||C.BOX_START;S.gem=S.gem||0;S.xp=S.xp||0;S.timer=S.timer||0;if(!S.starter){S.starter=1;S.timer+=C.START_TIMER}S.f1=S.f1==null?C.START_FRUIT:S.f1;S.f2=S.f2||0;S.f3=S.f3||0;S.codes=S.codes||{};if(!S.chestNext)S.chestNext=now()+C.CHEST_H*3600;S.timer=S.timer||0;S.name=S.name||'';S.mons.forEach(place);dispSize=S.size}

/* ===== 時間経過（1時間ステップ） ===== */
function hatchCheck(m){if(m.stage==='egg'&&m.eh>=eggH(m)){m.stage='baby';S.gem+=C.EVOLVE_GEMS.baby;msg(`たまごがかえった！（宝石+${C.EVOLVE_GEMS.baby}）`);fxQ.push({m,k:'evo'});m.flash=1.2}}
function useTimer(){const m=cur();if(!m||m.stage!=='egg'||S.timer<1)return;S.timer--;m.eh+=C.TIMER_H;hatchCheck(m);act()}
function evo(m){let n;while((n=needXp(m))&&m.exp>=n){m.exp-=n;m.stage=ST[ST.indexOf(m.stage)+1];S.gem+=C.EVOLVE_GEMS[m.stage];msg(nmOf(m)+'が'+SL[m.stage]+'に進化した！（宝石+'+C.EVOLVE_GEMS[m.stage]+'）');const g5=m.stage==='god';fxQ.push({m,k:g5?'god':'evo'});m.flash=g5?2.2:1.2}}
function hourStep(m){
 if(m.dead)return;
 if(m.stage==='egg'){m.eh++;hatchCheck(m);return}
 m.hunger=Math.max(0,m.hunger-C.HUNGER_DECAY);
 m.starve=m.hunger===0?m.starve+1:0;
 if(m.starve>=C.DEATH_H){m.dead=true;return}
 if(m.hunger>0){const mu=C.RARITY[m.rar||0].mult,sp0=SPECIES[m.sp],inc=sp0.inc;S.stone+=inc?inc.stone:Math.round(C.STONE[m.stage]*mu);S.coin+=inc?inc.coin:Math.round(C.COIN[m.stage]*mu);if(sp0.bring){m.tc=(m.tc||0)+1;if(m.tc>=sp0.bring.every){m.tc=0;S.timer+=Math.max(1,Math.round(sp0.bring.n*mu))}}}
 if(m.hunger>0&&m.stage!=='god'){m.exp+=C.PASSIVE_EXP;evo(m)}
}
function advance(sec){S.acc+=sec;const n=Math.floor(S.acc/3600);S.acc-=n*3600;
 for(let i=0;i<n;i++)S.mons.forEach(hourStep);return n}
function tick(){const t=now();const n=advance(t-S.last);S.last=t;chestCheck(t);save();hud();if(n){ui();shopUI()}return n}

const cur=()=>S.mons.find(m=>m.id===sel);
function feed(i){const m=cur(),f=C.FRUITS[i];if(!m||m.dead||m.stage==='egg'||!f||S[f.id]<1)return;
 if(m.hunger>C.FEED_ALLOWED_BELOW)return msg('お腹がいっぱいです');
 S[f.id]--;m.hunger=Math.min(C.HUNGER_MAX,m.hunger+f.fill);if(m.hunger>0)m.starve=0;act(f.name+'をあげた！')}

 for(let i=0;i<26;i++){const a=Math.random()*6.28,v=rnd(30,100);parts.push({x:sx,y:sy-16,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6-60,l:0,d:rnd(.7,1.3),s:rnd(2,4),c:['#ffe08a','#fff','#6ee7f9','#b48cff'][i%4]})}

function drawChest(t){const[sx,sy]=P(S.cx,S.cy),im=ICI.chest;g.fillStyle='#0003';g.beginPath();g.ellipse(sx,sy,16,6,0,0,7);g.fill();
 if(im.complete&&im.naturalWidth){const w=38,h=w*im.naturalHeight/im.naturalWidth;g.shadowColor='#ffe08a';g.shadowBlur=12+Math.sin(t*4)*6;g.drawImage(im,sx-w/2,sy+3-h+Math.sin(t*3)*2,w,h);g.shadowBlur=0}
 g.fillStyle='#fff';const k=Math.sin(t*5)>0?3:2;g.fillRect(sx+14,sy-26,k,k);g.fillRect(sx-16,sy-18+Math.sin(t*3)*2,2,2)}
function chestHit(e){if(!S.chest)return false;const[px,py]=wpt(e),[sx,sy]=P(S.cx,S.cy);return Math.hypot(px-sx,py-(sy-14))<30}

function gmSummon(){if(!isGM())return;if(S.mons.length>=S.size**2)return mm('キャパがいっぱいです');const egg=mk(SPECIES.findIndex(s=>s.n==='オーロ'),4);S.mons.push(egg);lastEgg=egg;closeMenu();act();showGet(egg)}

 let egg=null;if(R.egg!=null){if(S.mons.length>=S.size**2)return mm('キャパがいっぱいです。空きを作ってからもう一度入力してください');egg=mk(SPECIES.findIndex(s=>s.n===R.egg),0);S.mons.push(egg);lastEgg=egg}
 S.codes[v]=1;for(const k of['gem','stone','coin','timer','xp'])if(R[k])S[k]+=R[k];

function release(){const m=cur(),r0=m&&C.RELEASE[m.stage],r=r0&&(SPECIES[m.sp].sell?{c:SPECIES[m.sp].sell,s:0}:r0);if(!r||m.dead)return;
 S.coin+=r.c;S.stone+=r.s;S.mons=S.mons.filter(x=>x!==m);sel=null;act(`旅立ち！ コイン+${r.c} 魔石+${r.s}`)}

function buyEgg(mode){if(mode==='pick'&&!speciesFor(pickRar).includes(pickSp))return;const p=mode==='pick'?C.RARITY[pickRar].pick:C.EGG_PRICE;
 if(S.box.length>=S.boxCap)return msg('ボックスがいっぱいです');if(S.coin<p)return msg('コインが足りません');
 S.coin-=p;lastEgg=mk(mode==='pick'?pickSp:undefined,mode==='pick'?pickRar:rollRar());S.box.push(lastEgg);closeShop();act('たまごをボックスに入れた');showGet(lastEgg)}
let multi=null,boxSel=null;
function buyMulti(){const n=C.MULTI,p=C.EGG_PRICE*n;if(S.boxCap-S.box.length<n)return msg('ボックスの空きが足りません');if(S.coin<p)return msg('コインが足りません');
 S.coin-=p;const eggs=[];for(let i=0;i<n;i++){const e=mk(undefined,rollRar());S.box.push(e);eggs.push(e)}closeShop();act(n+'個のたまごをボックスに入れた');playMulti(eggs)}
function playMulti(eggs){multi={eggs,i:0};stepMulti()}
function stepMulti(){if(!multi)return;
 while(multi.i<multi.eggs.length&&multi.skip&&(multi.eggs[multi.i].rar||0)<3)multi.i++;
 if(multi.i>=multi.eggs.length){const e=multi.eggs;multi=null;showSummary(e);return}
 const m=multi.eggs[multi.i],big=(m.rar||0)>=3;
 showGet(m,{auto:true,fast:!big,done:()=>{if(multi){multi.i++;stepMulti()}}})}
function skipMulti(){if(!multi)return;multi.skip=true;const m=multi.eggs[multi.i];if(m&&(m.rar||0)>=3)return;gT.forEach(clearTimeout);gT=[];multi.i++;stepMulti()}
function showSummary(eggs){gT.forEach(clearTimeout);gT=[];$('getbody').style.animation='none';const best=Math.max(...eggs.map(e=>e.rar||0));lastEgg=null;
 $('getbody').innerHTML=`<h2 style="color:#ffe08a;margin:0 0 8px">${eggs.length}連の結果</h2><div class="bgrid sgrid">${eggs.map(e=>{const R=C.RARITY[e.rar||0];return `<div class="bcard" style="border-color:${R.col}"><img src="${SPR[IDS[e.sp]+'_egg']}" alt=""><div class="bn">${SPECIES[e.sp].n}</div><div class="rb" style="background:${R.col}">${R.n}</div></div>`}).join('')}</div><button onclick="closeGet()" style="margin-top:10px">OK</button>`;
 $('get').style.background=`radial-gradient(circle at 50% 30%,${C.RARITY[best].col}66,#0a0814 75%),#0a0814`;$('get').style.display='flex';$('get').onclick=null}
const boxSet=new Set();
function boxMsg(t){const e=$('boxMsg');if(e)e.textContent=t}
function boxFiltered(){const rf=$('bfr')?$('bfr').value:'',nf=$('bfn')?$('bfn').value.trim():'';return S.box.filter(m=>(rf===''||String(m.rar||0)===rf)&&(!nf||nmOf(m).indexOf(nf)>=0))}
function boxSelected(){return S.box.filter(m=>boxSet.has(String(m.id)))}
function boxAct(){const sel=boxSelected(),n=sel.length,free=S.size**2-S.mons.length,tot=sel.reduce((a,m)=>a+sellPrice(m),0);
 $('boxInfo').innerHTML=`📦 ${S.box.length}/${S.boxCap}　コロニーの空き ${free}`;
 $('boxAct').innerHTML=`<div>選択 <b>${n}</b>個${n?`　売却合計 ${ic('coin')}${tot}`:''}</div><div style="margin-top:4px"><button onclick="boxMoveSel()" ${n&&n<=free?'':'disabled'}>コロニーへ放出</button><button onclick="boxSellSel()" ${n?'':'disabled'}>売却</button></div>${n>free?'<div class="dev">選択数がコロニーの空きより多いので、売却のみできます</div>':''}`}
function boxList(){const L=$('boxList');if(!L)return;const f=boxFiltered();
 L.innerHTML=f.map(m=>{const R=C.RARITY[m.rar||0];return `<div class="bcard ${boxSet.has(String(m.id))?'sel':''}" data-id="${m.id}" style="border-color:${R.col}" onclick="boxTap('${m.id}')"><i class="egi eg${m.sp}"></i><div class="bn">${nmOf(m)}</div></div>`}).join('')||'<div class="dev" style="grid-column:1/-1">該当するたまごがありません</div>';boxAct()}
function boxUI(){if($('boxm').style.display!=='flex')return;const ids=new Set(S.box.map(m=>String(m.id)));[...boxSet].forEach(i=>{if(!ids.has(i))boxSet.delete(i)});boxList()}
function boxTap(id){if(boxSet.has(id))boxSet.delete(id);else boxSet.add(id);const el=document.querySelector('[data-id="'+id+'"]');if(el)el.classList.toggle('sel',boxSet.has(id));boxAct()}
function boxAll(){boxFiltered().forEach(m=>boxSet.add(String(m.id)));boxList()}
function boxNone(){boxSet.clear();boxList()}
function boxMoveSel(){const sel=boxSelected(),free=S.size**2-S.mons.length;if(!sel.length)return;if(sel.length>free)return boxMsg('選択数がコロニーの空きより多いので、売却のみできます');
 sel.forEach(m=>{place(m);S.mons.push(m)});S.box=S.box.filter(m=>!boxSet.has(String(m.id)));boxSet.clear();act();boxMsg(sel.length+'個をコロニーに出した！')}
function boxSellSel(){const ids=new Set(boxSelected().map(m=>String(m.id)));if(!ids.size)return;const tot=S.box.filter(m=>ids.has(String(m.id))).reduce((a,m)=>a+sellPrice(m),0);
 ask(`選択した${ids.size}個のたまごを合計🪙${tot}で売りますか？`,'はい、売る',()=>{S.coin+=tot;S.box=S.box.filter(m=>!ids.has(String(m.id)));boxSet.clear();act();boxMsg(ids.size+'個を売却した（🪙'+tot+'）')})}
function boxNext(){const c=S.boxCap;if(c>=C.BOX_MAX)return null;return{add:C.BOX_STEP,cost:C.BOX_TIER_COST[Math.min(C.BOX_TIER_COST.length-1,Math.floor(c/200))]}}
function boxUpgrade(){const n=boxNext();if(!n)return;const c=n.cost;if(S.coin<c.coin||S.gem<c.gem||S.stone<c.stone)return;S.coin-=c.coin;S.gem-=c.gem;S.stone-=c.stone;S.boxCap=Math.min(C.BOX_MAX,S.boxCap+n.add);act('ボックスを拡張した！')}

 q.font='bold 30px sans-serif';q.fillStyle='#ffe08a';q.fillText(god?'神族はXP不要です':`${e}XP獲得！`,160,220);$('mgx').style.display='inline-block';save()}
