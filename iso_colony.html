<title>もふもふコロニー</title>

canvas{display:block;width:100%;background:#8fd3ff;touch-action:none}

#bar{width:100%;max-width:800px;display:flex;align-items:center;box-sizing:border-box;padding-right:8px}#nick{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:12}#nick .box{background:#2a3f57;border:3px solid #fff;border-radius:10px;padding:16px;text-align:center}

<div id="wrap"><canvas id="cv" width="640" height="360"></canvas><div id="zoom"><button onclick="zoom(1.3)">＋</button><button onclick="zoom(.77)">－</button><br><button onclick="focusSel()">🔍</button><button onclick="zoom(0)">全体</button></div></div>

<div id="get"><div id="getbody"></div></div>

function load(){try{S=JSON.parse(localStorage.getItem(C.KEY))}catch(e){}
 if(!S){S={coin:C.START_COIN,stone:0,size:C.START_SIZE,mons:[],last:now(),acc:0};S.mons.push(mk(0))}
 S.gem=S.gem||0;S.xp=S.xp||0;S.timer=S.timer||0;if(!S.starter){S.starter=1;S.timer+=C.START_TIMER}S.f1=S.f1==null?C.START_FRUIT:S.f1;S.f2=S.f2||0;S.f3=S.f3||0;S.codes=S.codes||{};if(!S.chestNext)S.chestNext=now()+C.CHEST_H*3600;S.timer=S.timer||0;S.name=S.name||'';S.mons.forEach(place);dispSize=S.size}
function save(){if(wiping)return;try{localStorage.setItem(C.KEY,JSON.stringify(S))}catch(e){}}
const msg=t=>$('msg').textContent=t;

/* ===== 時間経過（1時間ステップ） ===== */
function hatchCheck(m){if(m.stage==='egg'&&m.eh>=C.EGG_H){m.stage='baby';S.gem+=C.EVOLVE_GEMS.baby;msg(`たまごがかえった！（宝石+${C.EVOLVE_GEMS.baby}）`);fxQ.push({m,k:'evo'});m.flash=1.2}}
function useTimer(){const m=cur();if(!m||m.stage!=='egg'||S.timer<1)return;S.timer--;m.eh+=C.TIMER_H;hatchCheck(m);act()}
function evo(m){let n;while((n=C.EXP_NEED[m.stage])&&m.exp>=n){m.exp-=n;m.stage=ST[ST.indexOf(m.stage)+1];S.gem+=C.EVOLVE_GEMS[m.stage];msg(nmOf(m)+'が'+SL[m.stage]+'に進化した！（宝石+'+C.EVOLVE_GEMS[m.stage]+'）');const g5=m.stage==='god';fxQ.push({m,k:g5?'god':'evo'});m.flash=g5?2.2:1.2}}
function hourStep(m){
 if(m.dead)return;
 if(m.stage==='egg'){m.eh++;hatchCheck(m);return}
 m.hunger=Math.max(0,m.hunger-C.HUNGER_DECAY);
 m.starve=m.hunger===0?m.starve+1:0;
 if(m.starve>=C.DEATH_H){m.dead=true;return}
 S.stone+=C.STONE[m.stage];S.coin+=C.COIN[m.stage];
 if(m.hunger>0&&m.stage!=='god'){m.exp+=C.PASSIVE_EXP;evo(m)}
}
function advance(sec){S.acc+=sec;const n=Math.floor(S.acc/3600);S.acc-=n*3600;
 for(let i=0;i<n;i++)S.mons.forEach(hourStep);return n}
function tick(){const t=now();const n=advance(t-S.last);S.last=t;chestCheck(t);save();hud();if(n){ui();shopUI()}return n}

/* ===== アクション ===== */
const cur=()=>S.mons.find(m=>m.id===sel);
function feed(i){const m=cur(),f=C.FRUITS[i];if(!m||m.dead||m.stage==='egg'||!f||S[f.id]<1)return;
 if(m.hunger>C.FEED_ALLOWED_BELOW)return msg('お腹がいっぱいです');
 S[f.id]--;m.hunger=Math.min(C.HUNGER_MAX,m.hunger+f.fill);if(m.hunger>0)m.starve=0;act(f.name+'をあげた！')}
function usePotion(){const m=cur();if(!m||m.dead||m.stage==='egg'||m.stage==='god'||S.xp<1)return;S.xp--;m.exp+=C.XP_POTION;evo(m);act('XPポーションを使った！ XP+'+C.XP_POTION)}
function buyItem(id){const k=id==='xp'?'stone':'gem',p=id==='xp'?C.XP_POTION_STONE:C.FRUITS.find(f=>f.id===id).gem;if(S[k]<p)return;S[k]-=p;S[id]++;act()}
function nickOpen(id){S.nk=id;if(S.coin<C.NAMETAG_PRICE)return msg('コインが足りません');$('nki').value='';$('nick').style.display='flex'}
function nickOk(){const m=S.mons.find(x=>String(x.id)===String(S.nk)),v=$('nki').value.trim();if(!m||!v||S.coin<C.NAMETAG_PRICE)return;
 S.coin-=C.NAMETAG_PRICE;m.nick=v.slice(0,8);$('nick').style.display='none';act(m.nick+'と名付けた！')}
function chestCheck(t){if(!S.chest&&t>=S.chestNext){S.chest=true;const e=Math.random()<.5;S.cx=e?S.size-.5:rnd(.4,S.size-.4);S.cy=e?rnd(.4,S.size-.4):S.size-.5;msg('宝箱が現れた！ コロニーの端っこを探してみよう')}}
function openChest(){if(!S.chest)return;const R=C.CHEST,[sx,sy]=P(S.cx,S.cy);S.coin+=R.coin;S.stone+=R.stone;S.gem+=R.gem;S.f1+=R.fruit;S.chest=false;S.chestNext=now()+C.CHEST_H*3600;
 for(let i=0;i<26;i++){const a=Math.random()*6.28,v=rnd(30,100);parts.push({x:sx,y:sy-16,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6-60,l:0,d:rnd(.7,1.3),s:rnd(2,4),c:['#ffe08a','#fff','#6ee7f9','#b48cff'][i%4]})}
 parts.push({txt:'宝箱ゲット！',x:sx,y:sy-50,l:0,d:1.6});parts.push({ring:1,x:sx,y:sy,l:0,d:1});
 act(`宝箱を開けた！ コイン${R.coin}・魔石${R.stone}・宝石${R.gem}・フルーツ×${R.fruit}を獲得！`)}
function drawChest(t){const[sx,sy]=P(S.cx,S.cy),im=ICI.chest;g.fillStyle='#0003';g.beginPath();g.ellipse(sx,sy,16,6,0,0,7);g.fill();
 if(im.complete&&im.naturalWidth){const w=38,h=w*im.naturalHeight/im.naturalWidth;g.shadowColor='#ffe08a';g.shadowBlur=12+Math.sin(t*4)*6;g.drawImage(im,sx-w/2,sy+3-h+Math.sin(t*3)*2,w,h);g.shadowBlur=0}
 g.fillStyle='#fff';const k=Math.sin(t*5)>0?3:2;g.fillRect(sx+14,sy-26,k,k);g.fillRect(sx-16,sy-18+Math.sin(t*3)*2,2,2)}
function chestHit(e){if(!S.chest)return false;const[px,py]=wpt(e),[sx,sy]=P(S.cx,S.cy);return Math.hypot(px-sx,py-(sy-14))<30}
function exportData(){S.last=now();save();const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='colony_save_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);mm('データをファイルに保存しました')}
function importData(inp){const fl=inp.files[0];if(!fl)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.mons)||typeof d.coin!=='number')throw 0;
  localStorage.setItem(C.KEY,JSON.stringify(d));load();sel=null;fxQ.length=0;parts.length=0;zoom(0);ui();shopUI();mm('データを読み込みました')}catch(e){mm('読み込めませんでした')}inp.value=''};rd.readAsText(fl)}
function mm(t){$('menumsg').textContent=t}
function redeem(){const v=$('cd').value.trim(),R=C.CODE_REWARD;if(v!==C.CODE)return mm('コードが違います');if(S.codes[v])return mm('このコードは使用済みです');
 S.codes[v]=1;S.gem+=R.gem;S.stone+=R.stone;S.coin+=R.coin;S.timer+=R.timer;S.xp+=R.xp;$('cd').value='';$('cdrow').style.display='none';$('nm').value=S.name||'';act();mm('コード報酬を受け取りました！')}
function release(){const m=cur(),r=m&&C.RELEASE[m.stage];if(!r||m.dead)return;
 S.coin+=r.c;S.stone+=r.s;S.mons=S.mons.filter(x=>x!==m);sel=null;act(`旅立ち！ コイン+${r.c} 魔石+${r.s}`)}
function revive(){const m=cur();if(!m||!m.dead||S.stone<C.REVIVE)return;
 S.stone-=C.REVIVE;m.dead=false;m.hunger=50;m.starve=0;act('蘇生した！')}
function buyEgg(mode){const p=mode==='pick'?C.EGG_PICK_PRICE:C.EGG_PRICE;
 if(S.mons.length>=S.size**2)return msg('キャパがいっぱいです');if(S.coin<p)return msg('コインが足りません');
 S.coin-=p;lastEgg=mk(mode==='pick'?pickSp:undefined);S.mons.push(lastEgg);closeShop();act();showGet(lastEgg)}
function buyTimer(){if(S.gem<C.TIMER_GEM_PRICE)return;S.gem-=C.TIMER_GEM_PRICE;S.timer++;act('⏱を手に入れた！')}
function sellAsk(id){const m=S.mons.find(x=>String(x.id)===id);if(!m)return;const p=C.SELL[m.stage];
 ask(`${nmOf(m)}（${SL[m.stage]}）を🪙${p}で売りますか？`,'はい、売る',()=>{S.coin+=p;S.mons=S.mons.filter(x=>x!==m);if(sel===m.id)sel=null;act(`売却して🪙${p}を手に入れた`)})}
function landFx(old){const n=S.size,oyF=(H-n*TH)/2-14,Q=(x,y)=>[ox+(x-y)*TW/2,oyF+(x+y)*TH/2];
 for(let i=0;i<46;i++){let x,y;do{x=rnd(0,n);y=rnd(0,n)}while(x<old&&y<old);const[sx,sy]=Q(x,y);
  parts.push({x:sx,y:sy-6,vx:rnd(-25,25),vy:-rnd(30,80),l:-rnd(0,.5),d:rnd(.8,1.4),s:rnd(2,4),c:['#fff','#ffe08a','#9bff8a','#ff9be7'][i%4]})}
 const c=Q(n/2,n/2);parts.push({txt:'土地が広がった！',x:c[0],y:c[1]-40,l:0,d:1.8});parts.push({ring:1,x:c[0],y:c[1],l:0,d:1.2});parts.push({ring:1,x:c[0],y:c[1],l:-.25,d:1.2})}
function expand(){const c=C.EXPAND[S.size-C.START_SIZE];if(!c||S.coin<c.c||S.stone<c.s)return;
 S.coin-=c.c;S.stone-=c.s;const old=S.size;S.size++;landFx(old);closeShop();act(`土地を拡張！ キャパ${S.size**2}`)}
function act(t){if(t)msg(t);save();ui();shopUI()}

/* ===== UI ===== */
let pick=-1;
function hud(){$('menuInfo').innerHTML=`キャパ: ${S.mons.length}/${S.size**2}（土地 ${S.size}×${S.size}）<br>${ic('coin')} ${S.coin}　${ic('stone')} ${S.stone}　${ic('gem')} ${S.gem}　⏱ ${S.timer}<br>${ic('xp')} ${S.xp}　${ic('f1')} ${S.f1}　${ic('f2')} ${S.f2}　${ic('f3')} ${S.f3}<br>🕐 次回収集: ${Math.ceil((3600-S.acc)/60)}分`}
function ui(){hud();
 const m=cur();let h='モンスターをタップして選択';
 if(m){const s=SPECIES[m.sp],need=C.EXP_NEED[m.stage];
  h=`<b>${nmOf(m)}</b>（${SL[m.stage]}）${m.dead?' 💀死亡':''}<br>`;
  if(m.stage==='egg')h+=`あと約${Math.max(0,C.EGG_H-m.eh)}時間でふ化します<br><button onclick="useTimer()" ${S.timer<1?'disabled':''}>⏱で${C.TIMER_H}時間短縮（所持${S.timer}）</button>`;
  else{h+=`満腹 <span class="bar"><i style="width:${m.hunger}%;background:#e5484d"></i></span> ${m.hunger}/100${m.hunger===0&&!m.dead?`（飢餓 ${m.starve}/${C.DEATH_H}h）`:''}<br>
  経験 <span class="bar"><i style="width:${need?m.exp/need*100:100}%;background:#b48cff"></i></span> ${need?m.exp+'/'+need+'（次: '+SL[ST[ST.indexOf(m.stage)+1]]+'）':'MAX'}<br>`+
  (m.dead?`<button onclick="revive()" ${S.stone<C.REVIVE?'disabled':''}>蘇生（${ic('stone')}${C.REVIVE}）</button>`:
  `${C.FRUITS.map((f,i)=>`<button onclick="feed(${i})" ${S[f.id]<1?'disabled':''}>${ic(f.id)}×${S[f.id]}</button>`).join('')}<button onclick="usePotion()" ${S.xp<1||m.stage==='god'?'disabled':''}>${ic('xp')}×${S.xp}</button><button onclick="startMG()">ミニゲーム</button><button onclick="release()">放出</button>`)}}
 $('panel').innerHTML=h}
let pickSp=0;
function shopUI(){const c=C.EXPAND[S.size-C.START_SIZE],free=S.mons.length<S.size**2,gods=S.mons.filter(m=>m.stage==='god');
 const row=(l,b,pr,dis,fn)=>`<div class="srow"><span>${l}</span><button onclick="${fn}" ${dis?'disabled':''}>${pr}</button></div>`;
 $('shopBody').innerHTML=`<div>${ic('coin')} ${S.coin}　${ic('stone')} ${S.stone}　${ic('gem')} ${S.gem}　⏱ ${S.timer}</div><hr>
 ${row('🥚 ランダムたまご','',ic('coin')+C.EGG_PRICE,S.coin<C.EGG_PRICE||!free,"buyEgg('rand')")}
 <div class="srow">🎯 えらぶたまご<select onchange="pickSp=+this.value">${SPECIES.map((s,i)=>`<option value="${i}" ${i===pickSp?'selected':''}>${s.n}</option>`).join('')}</select><button onclick="buyEgg('pick')" ${S.coin<C.EGG_PICK_PRICE||!free?'disabled':''}>${ic('coin')}${C.EGG_PICK_PRICE}</button></div><hr>
 ${C.FRUITS.map(f=>row(`${ic(f.id)} ${f.name}（満腹+${f.fill}）×${S[f.id]}`,'',ic('gem')+f.gem,S.gem<f.gem,`buyItem('${f.id}')`)).join('')}
 ${row(`⏱ 時短（ふ化-${C.TIMER_H}h）×${S.timer}`,'',ic('gem')+C.TIMER_GEM_PRICE,S.gem<C.TIMER_GEM_PRICE,'buyTimer()')}
 ${row(`${ic('xp')} XPポーション（XP+${C.XP_POTION}）×${S.xp}`,'',ic('stone')+C.XP_POTION_STONE,S.stone<C.XP_POTION_STONE,"buyItem('xp')")}<hr>
 <div>🏷 名札（神族に名前をつける）</div>${gods.map(m=>row(nmOf(m),'',ic('coin')+C.NAMETAG_PRICE,S.coin<C.NAMETAG_PRICE,`nickOpen('${m.id}')`)).join('')||'<div class="dev">神族がいません</div>'}<hr>
 <div class="srow">🗺 土地拡張${c?` ${S.size}→${S.size+1}<button onclick="expand()" ${S.coin<c.c||S.stone<c.s?'disabled':''}>${ic('coin')}${c.c} ${ic('stone')}${c.s}</button>`:'（最大）'}</div>
 <hr><div>キャラを売る</div>${S.mons.map(m=>row(`${nmOf(m)}（${SL[m.stage]}）`,'',ic('coin')+C.SELL[m.stage],false,`sellAsk('${m.id}')`)).join('')||'<div class="dev">いません</div>'}`}
function isGM(){return(S.name||'').trim()===C.GM_NAME}
function gmUI(){$('gm').style.display=isGM()?'block':'none'}
function setName(v){const t=v.trim();$('cdrow').style.display=t==='NEXT'?'block':'none';if(t==='NEXT')return;S.name=v;save();gmUI()}
function gmAdd(){if(!isGM())return;const n=Math.floor(+$('gn').value||0);if(n<=0)return;S[$('gi').value]+=n;act('アイテムを追加した')}
function openShop(){shopUI();$('shopm').style.display='flex'}
function closeShop(){$('shopm').style.display='none'}
function openMenu(){hud();$('cdrow').style.display='none';mm('');$('nm').value=S.name||'';gmUI();$('menu').style.display='flex'}
function closeMenu(){$('menu').style.display='none'}
let wiping=false;
function ask(t,yl,fn){$('cft').textContent=t;$('cfy').textContent=yl;$('cfy').onclick=()=>{$('cf').style.display='none';fn()};$('cf').style.display='flex'}
function delData(){ask('本当にリセットしますか？','はい',()=>ask('最終確認です。すべてのデータが消え、元に戻せません。リセットしますか？','はい、リセットする',resetAll))}
function resetAll(){try{localStorage.removeItem(C.KEY)}catch(e){}
 S={coin:C.START_COIN,stone:0,gem:0,timer:C.START_TIMER,starter:1,xp:0,f1:C.START_FRUIT,f2:0,f3:0,codes:{},chest:false,chestNext:now()+C.CHEST_H*3600,name:S.name||'',size:C.START_SIZE,mons:[],last:now(),acc:0};S.mons.push(mk(0));dispSize=S.size;
 sel=null;fxQ.length=0;parts.length=0;zoom(0);save();closeMenu();ui();shopUI();msg('データをリセットしました')}

 let c='';for(let i=0;i<26;i++)c+=`<span style="left:${rnd(0,100)}%;animation-delay:${rnd(0,1.2)}s;font-size:${rnd(14,28)}px">${['✨','⭐','🌟'][i%3]}</span>`;
 $('getbody').innerHTML=`<div class="conf">${c}</div><div class="rays"></div><img src="${src}" width="120" alt=""><h2>タマゴゲット！</h2><div>${sp.n}のたまご</div><button onclick="closeGet()">OK</button>`;
 $('get').style.display='flex'}

function skip(h){if(!isGM())return;advance(h*3600);act(h+'時間経過')}

/* ===== アイソメ描画 ===== */
const cv=$('cv'),g=cv.getContext('2d'),W=640,H=360,TW=80,TH=40;
let oy=0;const ox=W/2,cam={z:1,x:W/2,y:H/2-14};
const P=(x,y)=>[ox+(x-y)*TW/2,oy+(x+y)*TH/2];
function poly(pts,f){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=f;g.fill()}
function cloud(x,y,s){g.fillStyle='#fff';[[0,0,30],[28,-8,24],[-28,4,22],[56,4,20]].forEach(c=>{g.beginPath();g.ellipse(x+c[0]*s,y+c[1]*s,c[2]*s,c[2]*s*.6,0,0,7);g.fill()})}
function sky(t){const k=g.createLinearGradient(0,0,0,H);k.addColorStop(0,'#6cc3ff');k.addColorStop(1,'#d9f1ff');g.fillStyle=k;g.fillRect(0,0,W,H);
 [[40,50,1],[300,30,1.3],[520,80,.9]].forEach((c,i)=>cloud(((c[0]+t*(8+i*4))%(W+200))-100,c[1],c[2]))}
function island(){const n=dispSize,d=26,a=P(0,n),b=P(n,n),r=P(n,0);
 poly([a,b,[b[0],b[1]+d],[a[0],a[1]+d]],'#7a4f2d');poly([b,r,[r[0],r[1]+d],[b[0],b[1]+d]],'#5e3b20');
 for(let x=0;x<n;x++)for(let y=0;y<n;y++){
  const x1=Math.min(x+1,n),y1=Math.min(y+1,n);poly([P(x,y),P(x1,y),P(x1,y1),P(x,y1)],(x+y)%2?'#4fcf3f':'#5bd94a');
  for(let k=0;k<3;k++){const h=Math.sin((x*7+y*13+k*5)*91.7)*43758.5,u=Math.abs(h-Math.floor(h)),v=Math.abs((h*7)%1);

 for(let i=0;i<4;i++)parts.push({ring:1,x:sx,y:sy,l:-i*.25,d:1.3});
 parts.push({rays:1,x:sx,y:sy-30,l:0,d:2.2});parts.push({flash:1,l:0,d:1.1});parts.push({pillar:1,x:sx,y:sy,l:0,d:1.6});parts.push({pillar:1,x:sx,y:sy,l:.3,d:1.6});
 parts.push({txt:'神族に進化！',big:1,x:sx,y:sy-80,l:0,d:2})}
 if(k==='evo'){parts.push({pillar:1,x:sx,y:sy,l:0,d:1.1});parts.push({txt:'進化！',x:sx,y:sy-70,l:0,d:1.4})}}
function drawFx(dt){for(const p of parts){p.l+=dt;if(p.l<0)continue;const u=p.l/p.d;
 if(p.ring){g.strokeStyle=`rgba(255,240,150,${1-u})`;g.lineWidth=3;g.beginPath();g.ellipse(p.x,p.y,10+u*70,(10+u*70)*.5,0,0,7);g.stroke()}
 else if(p.pillar){const w=18*(1-u*.5),gr=g.createLinearGradient(0,p.y-110,0,p.y);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,`rgba(255,244,170,${.7*(1-u)})`);g.fillStyle=gr;g.fillRect(p.x-w,p.y-110,w*2,110)}
 else if(p.flash){g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle=`rgba(255,255,255,${.85*(1-u)})`;g.fillRect(0,0,W,H);g.restore()}
 else if(p.rays){g.save();g.translate(p.x,p.y);g.rotate(u*1.2);g.globalAlpha=.55*(1-u);g.fillStyle='#fff3a0';for(let i=0;i<12;i++){g.rotate(Math.PI/6);g.beginPath();g.moveTo(0,0);g.lineTo(-7,-130);g.lineTo(7,-130);g.closePath();g.fill()}g.restore()}
 else if(p.ch){p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=Math.min(1,2*(1-u));g.font='16px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(p.ch,p.x,p.y);g.globalAlpha=1}
 else if(p.txt){g.globalAlpha=Math.min(1,2*(1-u));g.font=(p.big?'bold 26px':'bold 18px')+' sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='#7a4f00';g.fillStyle='#fff3a0';const y=p.y-u*20;g.strokeText(p.txt,p.x,y);g.fillText(p.txt,p.x,y);g.globalAlpha=1}
 else{p.vy+=60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=Math.max(0,1-u);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);g.globalAlpha=1}}
 for(let i=parts.length;i--;)if(parts[i].l>=parts[i].d)parts.splice(i,1)}
const BS=[1,1,2,1.6,1.3,1.1,.95,.95];const sc=()=>{const i=Math.floor(dispSize),f=dispSize-i;return cam.z*(BS[i]+(BS[Math.min(7,i+1)]-BS[i])*f)};
const cl=v=>Math.min(S.size-.3,Math.max(.3,v));
let last=performance.now();
function frame(ts){
 const dt=Math.min(.1,(ts-last)/1000);last=ts;const t=ts/1000;dispSize+=(S.size-dispSize)*Math.min(1,dt*3.5);if(Math.abs(S.size-dispSize)<.002)dispSize=S.size;oy=(H-dispSize*TH)/2-14;
 while(fxQ.length){const e=fxQ.shift();if(S.mons.includes(e.m))burst(e.m,e.k)}
 S.mons.forEach(m=>{if(m.flash>0)m.flash-=dt});
 S.mons.forEach(m=>{if(m.dead||m.stage==='egg'||m.mode==='held')return;
  if(m.mode==='jump'){m.jt+=dt;if(m.jt>.7){m.mode='idle';m.w=rnd(2,5)}}
  else if(m.mode==='walk'){const dx=m.tx-m.gx,dy=m.ty-m.gy,d=Math.hypot(dx,dy);
   if(d>.03){const v=Math.min(d,.28*dt);m.gx+=dx/d*v;m.gy+=dy/d*v}else{m.mode='idle';m.w=rnd(2,5)}}
  else{m.w-=dt;if(m.w<=0){if(Math.random()<.4){m.mode='jump';m.jt=0}else{m.mode='walk';m.tx=cl(m.gx+rnd(-1,1));m.ty=cl(m.gy+rnd(-1,1))}}}});
 sky(t);g.save();g.translate(W/2,H/2);g.scale(sc(),sc());g.translate(-cam.x,-cam.y);
 island();if(S.chest)drawChest(t);[...S.mons].sort((a,b)=>a.gx+a.gy-b.gx-b.gy).forEach(m=>drawMon(m,t));drawFx(dt);g.restore();
 requestAnimationFrame(frame)}
function zoom(f){if(!f||(cam.z=Math.min(2,Math.max(1,cam.z*f)))<=1){cam.z=1;cam.x=W/2;cam.y=H/2-14}}
function focusSel(){const m=cur();if(!m)return msg('先にモンスターを選んでください');const[sx,sy]=P(m.gx,m.gy);cam.x=sx;cam.y=sy-20;cam.z=1.6}
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87)},{passive:false});
let dr=null;
const wpt=e=>{const r=cv.getBoundingClientRect();return[((e.clientX-r.left)*W/r.width-W/2)/sc()+cam.x,((e.clientY-r.top)*H/r.height-H/2)/sc()+cam.y]};
function hit(e){const[px,py]=wpt(e);let best=null,bd=40/sc();S.mons.forEach(m=>{const[sx,sy]=P(m.gx,m.gy),d=Math.hypot(px-sx,py-(sy-SZ[m.stage]/2));if(d<bd){bd=d;best=m}});return best}
cv.addEventListener('pointerdown',e=>{if(chestHit(e)){openChest();return}const m=hit(e);dr={x:e.clientX,y:e.clientY,mv:0,m};cv.setPointerCapture(e.pointerId);if(m){sel=m.id;ui()}});
cv.addEventListener('pointermove',e=>{if(!dr)return;const k=W/cv.getBoundingClientRect().width,dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr.x=e.clientX;dr.y=e.clientY;dr.mv+=Math.abs(dx)+Math.abs(dy);
 if(dr.m){if(dr.mv>8){const m=dr.m,[px,py]=wpt(e),a=(px-ox)*2/TW,b=(py+SZ[m.stage]/2-oy)*2/TH,lim=S.size-.15;
  m.mode='held';m.gx=Math.min(lim,Math.max(.15,(a+b)/2));m.gy=Math.min(lim,Math.max(.15,(b-a)/2));m.tx=m.gx;m.ty=m.gy}}
 else if(dr.mv>8&&cam.z>1){cam.x-=dx*k/sc();cam.y-=dy*k/sc()}});
const up=()=>{if(dr){if(dr.m&&dr.m.mode==='held'){dr.m.mode='idle';dr.m.w=rnd(1,3)}else if(!dr.m&&dr.mv<8){sel=null;ui()}}dr=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ===== ミニゲーム ===== */
const mg=$('mg'),q=mg.getContext('2d');let G=null;
const NAMES=['障害物ジャンプ','食べ物キャッチ','モンスター叩き'];
function startMG(){const m=cur();if(!m||m.dead||m.stage==='egg'||G)return;
 const k=nextK();
 G={k,m,t:C.GAME_SEC,score:0,tm:0,px:60,py:330,vy:0,obs:[],stars:[],items:[],bx:160,hole:-1,hl:0,done:false};
 $('mgt').textContent=`${NAMES[k]}　${k==0?'タップでジャンプ！⭐で+1':k==1?'ドラッグでカゴを動かす':'👾をタップ！👧はタップしない'}`;
 $('mgx').style.display='none';$('ov').style.display='flex';last2=performance.now();requestAnimationFrame(mgLoop)}
let last2=0,bag=[];function nextK(){if(!bag.length)bag=[0,1,2].sort(()=>Math.random()-.5);return bag.pop()}
function mgPos(e){const r=mg.getBoundingClientRect();return[(e.clientX-r.left)*320/r.width,(e.clientY-r.top)*400/r.height]}
mg.addEventListener('pointerdown',e=>{if(!G||G.done)return;const [x,y]=mgPos(e);
 if(G.k===0&&G.py>=330)G.vy=-640;
 if(G.k===1)G.bx=x;
 if(G.k===2&&G.mo){const o=G.mo.find(o=>Math.hypot(x-(60+(o.h%3)*100),y-(110+Math.floor(o.h/3)*100))<42);
  if(o){if(o.girl)G.oops=.8;else G.score++;G.mo=G.mo.filter(z=>z!==o)}}});
mg.addEventListener('pointermove',e=>{if(G&&G.k===1&&!G.done&&e.buttons)G.bx=mgPos(e)[0]});
function mgLoop(ts){
 if(!G)return;const dt=Math.min(.05,(ts-last2)/1000);last2=ts;
 if(!G.done){G.t-=dt;G.tm+=dt;
  if(G.k===0){G.vy+=1400*dt;G.py=Math.min(330,G.py+G.vy*dt);if(G.py>=330)G.vy=0;
   if(G.tm>=(G.sp=G.sp||0)){G.obs.push({x:340,hit:false,ok:false});if((G.on=(G.on||0)+1)%2===0)G.stars.push({x:340,y:212});G.sp=G.tm+1.7}
   G.obs.forEach(o=>{o.x-=165*dt;if(!o.hit&&Math.abs(o.x-G.px)<16&&G.py>308)o.hit=true;if(!o.hit&&!o.ok&&o.x<G.px-16){o.ok=true;G.score++}});
   G.stars.forEach(s=>{s.x-=165*dt;if(!s.c&&Math.abs(s.x-G.px)<26&&Math.abs(s.y-(G.py-12))<34){s.c=1;G.score+=1}});
   G.obs=G.obs.filter(o=>o.x>-30);G.stars=G.stars.filter(s=>s.x>-30&&!s.c)}
  if(G.k===1){if(G.tm>=(G.sp=G.sp||0)){G.items.push({x:rnd(20,300),y:-10,b:Math.random()<.3,e:['🍎','🍖','🥕','🍇'][Math.floor(Math.random()*4)]});G.sp=G.tm+.45}
   G.items.forEach(i=>{i.y+=190*dt;if(i.y>340&&i.y<380&&Math.abs(i.x-G.bx)<38&&!i.c){i.c=1;G.score=Math.max(0,G.score+(i.b?-3:1))}});
   G.items=G.items.filter(i=>i.y<420&&!i.c)}
  if(G.k===2){G.hl-=dt;G.mo=G.mo||[];const had=G.mo.length;G.mo.forEach(o=>o.ttl-=dt);G.mo=G.mo.filter(o=>o.ttl>0);if(had&&!G.mo.length)G.hl=Math.max(G.hl,.3);
   if(!G.mo.length&&G.hl<=0){const hs=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5).slice(0,2),gs=hs.map(()=>Math.random()<.5);if(gs[0]&&gs[1])gs[Math.random()<.5?0:1]=false;G.mo=hs.map((h,i)=>({h,girl:gs[i],ttl:1.2}))}
   G.oops=Math.max(0,(G.oops||0)-dt)}
  if(G.t<=0)endMG()}
 if(!G.done)drawMG();if(G&&!G.done)requestAnimationFrame(mgLoop)}
function drawMG(){
 q.fillStyle='#bfe9ff';q.fillRect(0,0,320,400);q.textAlign='center';q.textBaseline='middle';
 if(G.k===0){q.fillStyle='#5bd94a';q.fillRect(0,350,320,50);q.font='34px serif';
  q.fillText(SPECIES[G.m.sp].e[0],G.px,G.py+10);G.obs.forEach(o=>{q.globalAlpha=o.hit?.4:1;q.fillText('🌵',o.x,336);q.globalAlpha=1});G.stars.forEach(s=>q.fillText('⭐',s.x,s.y))}
 if(G.k===1){q.fillStyle='#e8d9a8';q.fillRect(0,380,320,20);q.font='30px serif';G.items.forEach(i=>q.fillText(i.b?'💣':i.e,i.x,i.y));q.font='44px serif';q.fillText('🧺',G.bx,360)}
 if(G.k===2){q.fillStyle='#2a1a3a';q.fillRect(0,0,320,400);for(let i=0;i<9;i++){const x=60+(i%3)*100,y=110+Math.floor(i/3)*100;
   q.fillStyle='#000';q.beginPath();q.ellipse(x,y+14,34,14,0,0,7);q.fill();const o=(G.mo||[]).find(o=>o.h===i);if(o){q.font='44px serif';q.fillText(o.girl?'👧':'👾',x,y)}}}
 q.font='bold 18px sans-serif';q.fillStyle=G.k===2?'#fff':'#234';q.textAlign='left';if(G.k===2&&G.oops>0){q.fillStyle='#ff6b6b';q.font='bold 24px sans-serif';q.textAlign='center';q.fillText('やめて！',160,60)}q.font='bold 18px sans-serif';q.fillStyle=G.k===2?'#fff':'#234';q.textAlign='left';q.fillText(`スコア ${G.score}　残り ${Math.max(0,Math.ceil(G.t))}秒`,10,20)}
function xpFor(sc){let x=0;for(const[a,b]of C.XP_TABLE)if(sc>=a)x=b;return x}
function endMG(){G.done=true;const e=xpFor(G.score),m=G.m,god=m.stage==='god';
 if(!m.dead&&!god){m.exp+=e;evo(m)}
 q.fillStyle='#000c';q.fillRect(0,130,320,140);q.fillStyle='#fff';q.textAlign='center';q.font='bold 20px sans-serif';q.fillText(`スコア ${G.score}`,160,170);
 q.font='bold 30px sans-serif';q.fillStyle='#ffe08a';q.fillText(god?'神族はXP不要です':`${e}XP獲得！`,160,220);$('mgx').style.display='inline-block';save()}
function closeMG(){G=null;$('ov').style.display='none';act()}

/* ===== 起動 ===== */
load();ui();shopUI();
const away=now()-S.last;const hrs=tick();fxQ.length=0;
if(hrs>0)msg(`${Math.floor(away/3600)}時間ぶりの帰還！ 留守中の成長・収集を反映しました`);
setInterval(tick,1000);
window.addEventListener('beforeunload',()=>{S.last=now();save()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
requestAnimationFrame(frame);
</script></body></html>
